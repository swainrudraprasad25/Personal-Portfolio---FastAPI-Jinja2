{% extends "base.html" %}
{% block content %}
<section class="section">
    <h2>Messages</h2>
    <p>{{ items | length }} messages received</p>
    <div class="grid">
        {% for m in items %}
        <div class="card">
            <h3>{{ m.name }}</h3>
            <p>{{ m.email }}</p>
            <p>{{ m.message }}</p>
        </div>
        {% endfor %}
    </div>
</section>
{% endblock %}
